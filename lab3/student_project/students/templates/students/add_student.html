{% extends 'base.html' %}

{% block title %}إضافة طالب جديد{% endblock %}
{% block header_title %}إضافة طالب جديد{% endblock %}
{% block header_description %}إضافة طالب جديد إلى النظام{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-success text-white text-center rounded-top-3">
                <i class="fas fa-user-plus fa-lg me-2"></i> نموذج إضافة طالب
            </div>
            <div class="card-body p-4">
                <form method="POST" class="row g-3">
                    {% csrf_token %}
                    <div class="col-md-12 mb-3">
                        <label for="id_name" class="form-label">الاسم الكامل:</label>
                        <input type="text" class="form-control" id="id_name" name="name" required>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label for="id_email" class="form-label">البريد الإلكتروني:</label>
                        <input type="email" class="form-control" id="id_email" name="email" required>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label for="id_phone" class="form-label">رقم الهاتف:</label>
                        <input type="text" class="form-control" id="id_phone" name="phone" required>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label for="id_gpa" class="form-label">المعدل التراكمي:</label>
                        <input type="number" step="0.01" class="form-control" id="id_gpa" name="gpa" required>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label for="id_college" class="form-label">الكلية:</label>
                        <input type="text" class="form-control" id="id_college" name="college" required>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label for="id_address" class="form-label">العنوان:</label>
                        <input type="text" class="form-control" id="id_address" name="address" required>
                    </div>
                    <div class="col-12 mt-4">
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-plus me-2"></i> إضافة الطالب
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
